name: Orion Codex CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist


  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:

      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion_codex

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U orion -d orion_codex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx


      # --------------------------------------------------------
      # Ruff
      #
      # IMPORTANT:
      # We only check F821 here.
      #
      # F401 = unused imports
      # Your existing backend currently contains many of these,
      # so they should not block CI yet.
      #
      # F821 = undefined name
      # These are genuine code errors.
      # --------------------------------------------------------
      - name: Run linting
        run: |
          ruff check . \
            --select F821 \
            --output-format=github


      # --------------------------------------------------------
      # Type checking
      # --------------------------------------------------------
      - name: Run type checking
        run: |
          mypy . \
            --ignore-missing-imports \
            --no-error-summary


      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://orion:orion@localhost:5432/orion_codex
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-orion-codex-ci-123456
          DEBUG: "true"
          ENVIRONMENT: test

        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest \
              --cov=. \
              --cov-report=xml \
              --cov-report=term-missing
          else
            echo "No Python tests found."
            echo "Skipping pytest."
          fi


      # --------------------------------------------------------
      # Coverage
      # --------------------------------------------------------
      - name: Upload backend coverage
        if: always() && hashFiles('backend/coverage.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false


  # ============================================================
  # DOCKER
  # ============================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Backend Docker build
      # --------------------------------------------------------
      - name: Check backend Dockerfile
        id: backend-dockerfile
        shell: bash
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No backend/Dockerfile found."
          fi


      - name: Build backend Docker image
        if: steps.backend-dockerfile.outputs.exists == 'true'
        run: |
          docker build \
            -t orion-codex-backend:${{ github.sha }} \
            ./backend


      # --------------------------------------------------------
      # Frontend Docker build
      # --------------------------------------------------------
      - name: Check frontend Dockerfile
        id: frontend-dockerfile
        shell: bash
        run: |
          if [ -f frontend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/Dockerfile found."
          fi


      - name: Build frontend Docker image
        if: steps.frontend-dockerfile.outputs.exists == 'true'
        run: |
          docker build \
            -t orion-codex-frontend:${{ github.sha }} \
            ./frontend


  # ============================================================
  # DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - docker

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Deployment placeholder
        run: |
          echo "Staging deployment is not configured yet."
          echo "CI passed successfully."


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - docker

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Deployment placeholder
        run: |
          echo "Production deployment is not configured yet."
          echo "CI passed successfully."